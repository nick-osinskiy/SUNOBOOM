name: Vue navigation build and smoke tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vue-navigation.yml'
      - 'src/vue/**'
      - 'tests/vue-*'
      - 'package.json'
      - 'vite.config.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out existing SUNOBOOM
        uses: actions/checkout@v4

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check route models
        run: npm run test:vue-nav

      - name: Compile production Vue module
        run: npm run build:vue

      - name: Ensure published files exist
        run: |
          test -s dist/vue/sunoboom-vue.js
          test -s dist/vue/sunoboom-vue.css

      - name: Install Chromium browser for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Test both production layouts
        run: npm run test:vue-browser

      - name: Commit verified bundle only (do not enable live interface)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/vue/sunoboom-vue.js dist/vue/sunoboom-vue.css
          if ! git diff --cached --quiet; then
            git commit -m 'build: add browser-tested Vue navigation assets'
            git push origin HEAD:main
          fi
