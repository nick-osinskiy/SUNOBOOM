name: SUNOBOOM checks and production

on:
  push:
    branches: [main, codex/develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out existing SUNOBOOM
        uses: actions/checkout@v4

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit live Vue imports and orphaned source modules
        run: npm run audit:vue-imports

      - name: Check domain commands and repositories
        run: npm run test:domain

      - name: Check route models
        run: npm run test:vue-nav

      - name: Compile production Vue module
        run: npm run build:vue

      - name: Ensure published files exist
        run: |
          test -s dist/vue/sunoboom-vue.js
          test -s dist/vue/sunoboom-vue.css

      - name: Install Chromium browser for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Test both production layouts
        run: npm run test:vue-browser

      # Publish exactly the files that passed the tests, without a bot push to main.
      - name: Assemble verified production site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          mkdir -p _site/dist/vue
          cp dist/vue/sunoboom-vue.js dist/vue/sunoboom-vue.css _site/dist/vue/

      - name: Upload verified production site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy-production:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure production Pages
        uses: actions/configure-pages@v5
      - name: Deploy tested main to production
        id: deployment
        uses: actions/deploy-pages@v4
